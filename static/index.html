<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>AshXMusic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0c10; --card:#12151d; --card2:#171b25; --line:#1e2430;
  --tx:#e9ecf4; --dim:#8b92a5; --acc:#7c5cff; --acc2:#9d85ff;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(10,12,16,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#4f34d8);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px;fill:#fff}
h1{font-size:18px;font-weight:700;letter-spacing:.2px}
h1 span{color:var(--acc2)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--err)}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px}
.searchrow{display:flex;gap:8px}
#q{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--tx);font-size:15.5px;outline:none;transition:border .15s}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--dim)}
#go{border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;padding:0 20px;cursor:pointer}
#go:active{transform:scale(.97)}
.chips{display:flex;gap:8px;margin:12px 2px 16px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:rgba(124,92,255,.16);border-color:var(--acc);color:var(--acc2)}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);cursor:pointer;transition:background .15s}
.row:hover,.row.act{background:var(--card)}
.row.act .t{color:var(--acc2)}
.row img{width:50px;height:50px;border-radius:9px;object-fit:cover;background:var(--card2);flex:none}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:15px;display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;text-decoration:none}
.btn:active{transform:scale(.92)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dlbtn:hover{border-color:var(--ok);color:var(--ok)}
.btn.mp3btn{width:auto;padding:0 9px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--dim)}
.btn.mp3btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn[disabled]{opacity:.45}
.pctl{position:relative;overflow:hidden}
.pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0%;transition:width .4s;font-style:normal}
.hint{color:var(--dim);text-align:center;padding:44px 20px;font-size:14px}
.hint b{color:var(--tx)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:40px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c2030;border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,16,23,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s}
.player.up{transform:none}
.prow{display:flex;align-items:center;gap:12px;max-width:680px;margin:0 auto}
/* mini live-video window (YouTube player) with cover-art overlay */
.ytv{position:relative;width:104px;height:59px;border-radius:10px;overflow:hidden;background:var(--card2);flex:none;border:1px solid var(--line)}
.ytv iframe{position:absolute;top:0;left:0;width:208px;height:118px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.ytv .cvo{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .35s;filter:saturate(.9)}
.ytv.live .cvo{opacity:0}
.ytv .eq{position:absolute;left:6px;bottom:5px;width:16px;height:10px;display:none;gap:2px;align-items:flex-end;z-index:2}
.ytv.live .eq{display:flex}
.ytv .eq i{width:3px;background:var(--acc2);border-radius:1px;animation:eq 0.9s ease-in-out infinite}
.ytv .eq i:nth-child(2){animation-delay:.2s}.ytv .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.pinfo{flex:1;min-width:0}
.pt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa b{color:var(--acc2);font-weight:600}
#seek{width:100%;height:4px;margin-top:8px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:2px;outline:none;cursor:pointer}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc)}
#seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc)}
.time{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:4px;display:flex;justify-content:space-between}
#pb{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;flex:none;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <h1>Ash<span>X</span>Music</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="stx">connecting</span></div>
</header>

<div class="wrap">
  <form class="searchrow" id="sf" style="display:flex">
    <input id="q" type="search" placeholder="Search songs, artists…" autocomplete="off" enterkeyhint="search">
    <button id="go" type="submit">Go</button>
  </form>
  <div class="chips" id="chips">
    <button class="chip on" data-f="songs" type="button">Songs</button>
    <button class="chip" data-f="videos" type="button">Videos</button>
    <button class="chip" data-f="albums" type="button">Albums</button>
    <button class="chip" data-f="all" type="button">All</button>
  </div>
  <div id="list"><div class="hint">Search YouTube Music and <b>tap to play instantly</b> —<br>⤓ mp4 with cover art · <b>MP3</b> 320k mp3.<br>Direct wget links: <b>/dl/&lt;videoId&gt;</b> · <b>?fmt=mp3</b></div></div>
</div>

<div class="player" id="pl">
  <div class="prow">
    <div class="ytv" id="ytv">
      <div id="ytf"></div>
      <div class="cvo" id="cvo"></div>
      <div class="eq"><i></i><i></i><i></i></div>
    </div>
    <div class="pinfo">
      <div class="pt" id="pt">—</div>
      <div class="pa" id="pa"></div>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <div class="time"><span id="t1">0:00</span><span id="t2">0:00</span></div>
    </div>
    <button id="pb" aria-label="play/pause" type="button">▶</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<audio id="au" preload="auto"></audio>

<script>
const $=id=>document.getElementById(id), au=$("au");
let filter="songs", cur=null, seeking=false, dlTimer=null;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800);}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setPb(x){$("pb").textContent=x;}

fetch("/health").then(r=>r.json()).then(h=>{
  const ok=h.ok && h.cookie && h.cookie.logged_in;
  $("dot").className="dot "+(h.ok?(ok?"ok":""):"bad");
  $("stx").textContent=h.ok?(ok?"ready · logged in":"ready · no cookies"):"offline";
  if(h.ok && !ok) toast("No cookies set — add COOKIES_B64 on the server for full library access");
}).catch(()=>{$("dot").className="dot bad";$("stx").textContent="offline";});

$("sf").addEventListener("submit",e=>{e.preventDefault();search($("q").value.trim());});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  filter=b.dataset.f;
  if($("q").value.trim()) search($("q").value.trim());
});

async function search(q){
  if(!q)return;
  $("list").innerHTML='<div class="spin"></div>';
  try{
    const r=await fetch(`/search?q=${encodeURIComponent(q)}&filter=${filter}&limit=25`);
    const d=await r.json();
    const rs=(d.results||[]).filter(x=>x.videoId);
    if(!rs.length){$("list").innerHTML='<div class="hint">No results for <b>'+esc(q)+'</b></div>';return;}
    $("list").innerHTML=rs.map(t=>`
      <div class="row" id="r-${t.videoId}" data-v="${t.videoId}">
        <img src="${esc(t.thumbnail||"")}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="meta"><div class="t">${esc(t.title)}</div>
        <div class="s">${esc(t.artist||"")}${t.duration?" · "+esc(t.duration):""}</div></div>
        <button class="btn p pctl" data-play="${t.videoId}" type="button">▶<i class="pbar" id="pb-${t.videoId}"></i></button>
        <a class="btn mp3btn" data-mp3 href="/dl/${t.videoId}?fmt=mp3" download title="download 320k mp3 (cover art embedded)">MP3</a>
        <a class="btn dlbtn" data-dl href="/dl/${t.videoId}" download title="download mp4 with cover art (wget: /dl/${t.videoId})">⤓</a>
      </div>`).join("");
    // pre-buffer the top result inside the hidden YT player: tapping it
    // afterwards starts with ZERO fetch latency
    if(ytReady&&!cur&&rs[0]&&!ytBlocked.has(rs[0].videoId)){
      try{yt.cueVideoById(rs[0].videoId);}catch(e){}
    }
  }catch(e){$("list").innerHTML='<div class="hint">Search failed — is the server awake?</div>';}
}

$("list").addEventListener("click",e=>{
  const dla=e.target.closest("[data-dl]");
  if(dla){e.stopPropagation();toast("MP4 download started · wget: /dl/"+dla.closest(".row").dataset.v);return;}
  const m3=e.target.closest("[data-mp3]");
  if(m3){e.stopPropagation();toast("320k MP3 started · wget: /dl/"+m3.closest(".row").dataset.v+"?fmt=mp3");return;}
  const p=e.target.closest("[data-play]");
  if(p){play(p.dataset.play);return;}
  const row=e.target.closest(".row");
  if(row) play(row.dataset.v);
});

function rowInfo(vid){
  const row=document.getElementById("r-"+vid);
  return {title:row?row.querySelector(".t").textContent:vid,
          artist:row?row.querySelector(".s").textContent:"",
          thumb:row?((row.querySelector("img")||{}).src||""):""};
}

/* ================= DUAL-ENGINE INSTANT PLAYBACK =================
   Tap fires BOTH engines at once; the first one that actually makes
   sound wins and the other is silenced:
     A. YouTube's official iframe player  -> runs 100% client-side on
        the user's own IP (residential = never bot-walled), streams
        straight from googlevideo CDN. Zero server involvement.
     B. server /stream SABR pump          -> instant when the runner is
        warm; hard 12s budget server-side so it can never hang.
   If neither is audible within 5.5s -> download-then-play ladder.   */
let yt=null, ytReady=false, ytPending=null, engine=null, raceT=null;
const ytBlocked=new Set();

(function(){const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';s.async=true;
  document.head.appendChild(s);})();

window.onYouTubeIframeAPIReady=function(){
  yt=new YT.Player('ytf',{width:'208',height:'118',videoId:'',
    playerVars:{playsinline:1,controls:0,rel:0,fs:0,iv_load_policy:3,
                disablekb:1,origin:location.origin},
    events:{
      onReady:function(){ytReady=true;
        if(ytPending){const v=ytPending;ytPending=null;play(v);}},
      onStateChange:function(e){
        if(!cur)return;
        if(e.data===1){ytWins();}
        else if(e.data===0&&engine==='yt'){onEnded();}
        else if(e.data===2&&engine==='yt'){setPb('▶');}
      },
      onError:function(){
        // 2/5/100/101/150 — this video cannot be embed-played
        if(cur)ytBlocked.add(cur);
        $('ytv').classList.remove('live');
        if(engine==='yt'){engine=null;try{yt.stopVideo();}catch(e){}
          toast('Embed blocked by owner — using server engine…');}
      }
    }});
};

function ytWins(){
  if(engine==='yt')return;
  const first=!engine;
  killAudio();clearTimeout(raceT);
  engine='yt';
  $('ytv').classList.add('live');setPb('⏸');
  if(first)toast('⚡ instant — client-side');
}
function killAudio(){try{au.pause();au.removeAttribute('src');au.load();}catch(e){}}
function stopYt(){try{yt.stopVideo();}catch(e){}$('ytv').classList.remove('live');}

function play(vid){
  const info=rowInfo(vid);
  cur=vid;engine=null;clearTimeout(raceT);
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("act",r.dataset.v===vid));
  $("pt").textContent=info.title;$("pa").textContent=info.artist;
  $("cvo").style.backgroundImage=info.thumb?`url("${info.thumb}")`:"none";
  $("pl").classList.add("up");$("ytv").classList.remove("live");setPb("…");
  if("mediaSession" in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({
      title:info.title,artist:info.artist,album:"AshXMusic",
      artwork:info.thumb?[{src:info.thumb,sizes:"544x544"}]:[]});}catch(e){}
  }
  // ENGINE A — official YouTube player (client-side, user's IP)
  if(ytReady&&!ytBlocked.has(vid)){try{yt.loadVideoById(vid);}catch(e){}}
  else if(!ytReady){ytPending=vid;}
  // ENGINE B — server SABR stream (races engine A)
  killAudio();au.src=`/stream/${vid}`;au.play().catch(()=>{});
  fetch(`/play/${vid}`).catch(()=>{});   // pre-warm pot for next play
  // guard: nothing audible in 5.5s -> download-then-play
  raceT=setTimeout(()=>{if(cur===vid&&!engine)playViaDownload(vid,null);},5500);
}

function onEnded(){engine=null;setPb('▶');}

au.addEventListener("playing",()=>{
  if(!cur)return;
  if(engine==='yt'){killAudio();return;}      // yt won; stop wasted fetch
  if(engine!=='audio'){
    engine='audio';clearTimeout(raceT);stopYt();
  }
  setPb('⏸');
});
au.addEventListener("error",()=>{
  if(!cur||!au.src||engine==='yt')return;
  // yt engine may still win the race — only fall straight back when the
  // embed path is unavailable for this track
  if(!ytReady||ytBlocked.has(cur)){
    setTimeout(()=>{if(cur&&!engine)playViaDownload(cur,null);},400);
  }
});
au.addEventListener("ended",()=>{if(cur){engine=null;setPb('▶');}});
au.addEventListener("waiting",()=>{if(cur&&engine!=='yt')setPb("…");});
au.addEventListener("pause",()=>{if(cur&&engine==='audio'&&!au.ended)setPb('▶');});

function playViaDownload(vid,statusUrl){
  setPb("…");
  if(statusUrl){pollPlay(vid,statusUrl.split("/").pop());return;}
  // reuse an already-running download instead of starting a duplicate
  fetch(`/play/${vid}`).then(r=>r.json()).then(j=>{
    if(j.mode==="downloading"&&j.downloadId){pollPlay(vid,j.downloadId);return;}
    return fetch(`/downloads/${vid}`,{method:"POST"})
      .then(r=>r.json()).then(j2=>pollPlay(vid,j2.downloadId));
  }).catch(()=>{setPb("▶");toast("Could not start the fallback download");});
}
function pollPlay(vid,dlId){
  if(dlTimer)clearInterval(dlTimer);
  dlTimer=setInterval(async()=>{
    if(cur!==vid){clearInterval(dlTimer);dlTimer=null;return;}
    try{
      const st=await(await fetch(`/downloads/${dlId}`)).json();
      const pct=st.bytesTotal?Math.round(st.bytesDone/st.bytesTotal*100):0;
      if(st.status==="downloading"||st.status==="sabr")setPb(pct?pct+"%":"…");
      else if(st.status==="done"){
        clearInterval(dlTimer);dlTimer=null;
        if(!engine){killAudio();au.src=`/stream/${vid}`;au.play().catch(()=>{});}
      }
      else if(st.status==="error"){clearInterval(dlTimer);dlTimer=null;setPb("▶");toast("Couldn't prepare this track — try ⤓");}
    }catch(e){}
  },1500);
}

$("pb").addEventListener("click",()=>{
  if(!cur)return;
  if(engine==='yt'){
    try{yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo();}catch(e){}
  }else if(au.src){au.paused?au.play():au.pause();}
});

$("seek").addEventListener("input",()=>{seeking=true;});
$("seek").addEventListener("change",()=>{
  const f=$("seek").value/1000;
  if(engine==='yt'){try{const d=yt.getDuration();if(d)yt.seekTo(f*d,true);}catch(e){}}
  else if(au.duration)au.currentTime=f*au.duration;
  seeking=false;
});
au.addEventListener("timeupdate",()=>{
  if(engine==='yt')return;
  if(!seeking&&au.duration){$("seek").value=Math.round(au.currentTime/au.duration*1000);}
  $("t1").textContent=fmt(au.currentTime);
  if(au.duration)$("t2").textContent=fmt(au.duration);
});
setInterval(()=>{                       // YT engine progress ticker
  if(!cur||engine!=='yt')return;
  try{
    const d=yt.getDuration(),t=yt.getCurrentTime();
    if(d>0&&!seeking)$("seek").value=Math.round(t/d*1000);
    $("t1").textContent=fmt(t);
    if(d>0)$("t2").textContent=fmt(d);
  }catch(e){}
},300);
</script>
</body>
</html>
