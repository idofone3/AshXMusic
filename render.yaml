# Render Blueprint — AshXMusic API
# Deploy: Render dashboard -> New + -> Blueprint -> pick this repo.
# Free tier: no disks are used (they're paid-only); all storage is
# ephemeral (/tmp/downloads + container FS). Configure the optional
# secrets (COOKIES_B64, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) from the
# dashboard Environment tab after the first deploy.
services:
  - type: web
    name: ashxmusic-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
